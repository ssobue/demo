version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
  - package-ecosystem: "maven"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    ignore:
      - dependency-name: "org.graalvm.buildtools:native-maven-plugin"
        versions: ["1.1.6"]
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
