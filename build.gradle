import org.springframework.boot.gradle.plugin.SpringBootPlugin
import net.ltgt.gradle.errorprone.CheckSeverity

plugins {
    id 'java'
    id 'jacoco'
    id 'net.ltgt.errorprone' version '5.1.0'
    id 'org.springframework.boot' version '4.1.1'
    id 'com.github.spotbugs' version '6.5.11'
    id 'org.sonarqube' version '7.4.0.8496'
    id 'org.graalvm.buildtools.native' version '1.1.10'
}

group = 'dev.sobue.demo'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(SpringBootPlugin.BOM_COORDINATES)
    compileOnly platform(SpringBootPlugin.BOM_COORDINATES)
    annotationProcessor platform(SpringBootPlugin.BOM_COORDINATES)
    testImplementation platform(SpringBootPlugin.BOM_COORDINATES)
    testCompileOnly platform(SpringBootPlugin.BOM_COORDINATES)
    testAnnotationProcessor platform(SpringBootPlugin.BOM_COORDINATES)

    implementation 'org.springframework.boot:spring-boot-starter'
    compileOnly 'org.projectlombok:lombok'
    compileOnly 'org.jspecify:jspecify'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    errorprone 'com.google.errorprone:error_prone_core:2.50.0'
    errorprone 'com.uber.nullaway:nullaway:0.14.0'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
    jvmArgs '-Xshare:off'
    reports {
        junitXml.required = true
        html.required = true
    }
}

tasks.withType(JavaCompile).configureEach {
    if (name.toLowerCase(Locale.ROOT).contains('aot')) {
        options.errorprone.enabled = false
        return
    }
    options.errorprone {
        check('NullAway', CheckSeverity.ERROR)
        option('NullAway:OnlyNullMarked', 'true')
        option('NullAway:JSpecifyMode', 'true')
        if (name.toLowerCase(Locale.ROOT).contains('test')) {
            disable('NullAway')
        }
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.spotbugsMain {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('bootJar') {
    archiveFileName = "${project.name}.jar"
}

sonar {
    properties {
        property 'sonar.projectKey', 'ssobue_demo'
        property 'sonar.organization', 'ssobue'
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.sources', 'src/main/java,src/main/resources,.github'
        property 'sonar.tests', 'src/test/java'
        property 'sonar.coverage.jacoco.xmlReportPaths', layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile.path
    }
}
