name: Gradle CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ '25', '26' ]
    #env:
    #  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
    - name: Build with Gradle
      run: ./gradlew build
    #- name: Analyze with SonarQube Cloud
    #  if: ${{ matrix.java == '25' && env.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') }}
    #  run: ./gradlew -PjavaVersion=${{ matrix.java }} sonar -Dsonar.token="${SONAR_TOKEN}"


  native-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up GraalVM JDK 25
      uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
      with:
        java-version: '25'
        distribution: 'graalvm-community'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
    - name: Build native image with Gradle
      run: ./gradlew nativeCompile
    - name: Upload native image
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: demo-gradle-native
        path: build/native/nativeCompile/demo
